name: CI

on:
  pull_request:
    branches: [main, development]
  push:
    branches: [main, development]

# A new push to the same branch supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Full `npm ci`: some packages download native binaries in install scripts.
      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test with coverage thresholds
        run: npm run test:coverage

      # Placeholder CMS values are enough: queries fall back to empty results.
      - name: Build
        run: npm run build
        env:
          CONTENTFUL_SPACE_ID: ci-placeholder
          CONTENTFUL_DELIVERY_TOKEN: ci-placeholder
          CONTENTFUL_ENVIRONMENT: master

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    # Commits pushed to main/development were already checked on their PR.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # commitlint needs the full history to compare base and head.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate every commit on this pull request
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Scan the whole history, not just the latest commit.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
